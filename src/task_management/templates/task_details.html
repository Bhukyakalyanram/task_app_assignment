{% extends "base.html" %}

{% block title %}
Task Details
{% endblock %}

{% block content %}

<h1>Task Details</h1>

<p><strong>Task ID:</strong> {{ task.task_id }}</p>

<p><strong>Title:</strong> {{ task.title }}</p>

<p><strong>Description:</strong> {{ task.description }}</p>

<p><strong>Status:</strong> {{ task.status }}</p>

<p><strong>Priority:</strong> {{ task.priority }}</p>

<a class="button" href="{{ url_for('task.update_task', task_id=task.task_id) }}">
    Edit Task
</a>

<a class="button" href="{{ url_for('task.view_tasks') }}">
    Back to Tasks
</a>

{% endblock %}
